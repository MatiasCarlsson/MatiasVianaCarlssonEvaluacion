# Render deployment config for Notizen
# Docs: https://render.com/docs/infrastructures-as-code
# Deploy: connect this repo in Render and select "render.yaml" (Blueprint).

services:
  # ─── Backend (NestJS + Postgres externo, ej. Supabase) ────────────
  - type: web
    name: notizen-backend
    runtime: node
    region: oregon # cambia a la región más cercana
    plan: free
    rootDir: backend
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Persistencia JSON local. El filesystem de Render es efímero:
      # los datos se pierden en cada redeploy/reinicio del servicio.
      # En el plan free no hay discos persistentes; si necesitás persistir,
      # montá un "Persistent Disk" y apuntá JSON_DB_PATH a esa ruta (p. ej. /var/data/data.json).
      - key: JSON_DB_PATH
        value: ./data/data.json
      # URL del frontend para CORS (ajustá al dominio real de Render)
      - key: FRONTEND_URL
        sync: false # completá con la URL de notizen-frontend

  # ─── Frontend (React + Vite, SPA estática) ──────────────────────────
  - type: web
    name: notizen-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    # SPA fallback: cualquier ruta no-existente sirve index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # completá con https://notizen-backend.onrender.com/api
